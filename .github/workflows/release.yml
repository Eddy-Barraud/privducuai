name: Build, Sign & Release DMG

on:
  push:
    tags:
      - 'v*' # Triggers on release tags like v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Apple Certificate (Developer ID Application)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        run: |
          # Generate a random temporary password for the disposable CI keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          
          # Create and unlock temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Developer ID certificate into keychain
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Set keychain in search list and make it default
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          # Verify identity and extract the exact certificate name
          echo "=== Installed Signing Identities ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application:" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$SIGNING_IDENTITY" ]; then
            # Fallback to the first valid codesigning identity if not named Developer ID
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E '^\s*1\)' | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No codesigning identity found in the imported .p12 certificate. Please verify that the .p12 contains the private key."
            exit 1
          fi
          
          echo "Using Signing Identity: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: Build & Archive App
        run: |
          xcodebuild clean archive \
            -scheme Tiny-SFTP-server \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Tiny-SFTP-server.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-"

      - name: Export & Sign .app
        run: |
          mkdir -p "$RUNNER_TEMP/Export"
          cp -R "$RUNNER_TEMP/Tiny-SFTP-server.xcarchive/Products/Applications/Tiny-SFTP-server.app" "$RUNNER_TEMP/Export/Tiny-SFTP-server.app"
          
          # Sign all frameworks, dylibs, and the main app binary with Developer ID & Hardened Runtime
          codesign --force --deep --options runtime \
            --keychain "$RUNNER_TEMP/build.keychain" \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            "$RUNNER_TEMP/Export/Tiny-SFTP-server.app"

      - name: Create DMG
        run: |
          mkdir -p "$RUNNER_TEMP/dmg-source"
          cp -R "$RUNNER_TEMP/Export/Tiny-SFTP-server.app" "$RUNNER_TEMP/dmg-source/"
          ln -s /Applications "$RUNNER_TEMP/dmg-source/Applications"
          
          mkdir -p "$RUNNER_TEMP/dmg-output"
          hdiutil create -volname "Tiny SFTP Server" \
            -srcfolder "$RUNNER_TEMP/dmg-source" \
            -ov -format UDZO \
            "$RUNNER_TEMP/dmg-output/Tiny-SFTP-server.dmg"

      - name: Sign DMG
        run: |
          codesign --force \
            --keychain "$RUNNER_TEMP/build.keychain" \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            "$RUNNER_TEMP/dmg-output/Tiny-SFTP-server.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/dmg-output/Tiny-SFTP-server.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple Notarization Ticket
        run: |
          xcrun stapler staple "$RUNNER_TEMP/dmg-output/Tiny-SFTP-server.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dmg-output/Tiny-SFTP-server.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
